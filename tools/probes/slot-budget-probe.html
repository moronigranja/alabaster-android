<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>slot-budget-probe</title></head>
<body>
<pre id="o">running…</pre>
<script src="slot-budget-cases.js"></script>
<script>
/* The same case file the port's own CDP probes run, for a device whose WebView has no devtools
   (open this page in Chrome on the device; adb reverse tcp:8099 makes it reachable). */
(function () {
  var json = window.__adaSlotBudget || JSON.stringify({ error: 'slot-budget-cases.js did not run' });
  document.getElementById('o').textContent = json;
  var parsed = JSON.parse(json);
  var ok = parsed.cases ? parsed.cases.filter(function (k) { return k.ok; }).length : 0;
  document.title = 'slot-budget-probe done ' + ok + '/' + (parsed.cases ? parsed.cases.length : 0);
})();
</script>
</body></html>
